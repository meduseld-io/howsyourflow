<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Documentation - current</title>

    <!--
      The documentation moved to /docs/. This page stays behind because the old
      address was published and may be bookmarked or linked.

      Static hosting cannot answer with a 301, so this does what it can: a
      canonical link so search engines credit the new address rather than
      treating the two as duplicates, a script that replaces the history entry
      instead of adding one, so the back button does not land here and bounce
      forward again, and a meta refresh as the fallback for anything with
      scripting turned off.
    -->
    <link rel="canonical" href="https://howsyourflow.io/docs/" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=/docs/" />
    <script>
      location.replace('/docs/' + location.hash);
    </script>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #f4f6f8;
        color: #3d4454;
      }
      a {
        color: #0e9cb0;
      }
    </style>
  </head>
  <body>
    <p>The documentation has moved to <a href="/docs/">howsyourflow.io/docs/</a>.</p>
  </body>
</html>
